#pop.show{opacity:1}
#pop b{display:block;font-size:14px;margin-bottom:5px}
#pop span{font-size:13px;line-height:1.5}
aside{width:380px;max-width:44vw;background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto}
aside h2{font-size:17px;margin:0 0 10px;font-weight:650;line-height:1.3}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.hint,.msg{font-size:13.5px;line-height:1.55;color:#c9d4e0}
.msg{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.block{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.55}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;margin:0 6px 6px 0;background:#26303d;cursor:pointer;border:0}
.chip:hover{background:#304052}
details.eje{border:1px solid var(--line);border-left-width:4px;border-radius:10px;margin-bottom:8px;background:var(--p2)}
details.eje summary{cursor:pointer;padding:10px 14px;font-size:14px;font-weight:600;list-style:none;display:flex;gap:8px}
details.eje summary::-webkit-details-marker{display:none}
details.eje summary::before{content:"▸";transition:transform .15s}
details.eje[open] summary::before{transform:rotate(90deg)}
.eje .in{padding:0 14px 12px;font-size:13px;line-height:1.5}
.eje h4{margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.eje p{margin:0 0 6px}
.back{margin-bottom:12px}

 if(m.n===1)return{id,label:label(id),shape:"box",margin:10,widthConstraint:{maximum:160},color:{background:"#232b38",border:m.c,highlight:hl("#2c3646"),hover:hl("#2c3646")},font:{color:"#e6edf3",size:14,face:F},shapeProperties:{borderRadius:10},borderWidth:2};
 return{id,label:label(id),shape:"box",margin:8,widthConstraint:{maximum:190},color:{background:"#161c24",border:m.c,highlight:hl("#222b38"),hover:hl("#222b38")},font:{color:"#c9d4e0",size:12,face:F},shapeProperties:{borderRadius:8},borderWidth:1.2};}
function arista(h){const m=meta[h];return{id:"e_"+h,from:m.p,to:h,color:{color:m.n<=1?m.c:"#4a586a",opacity:.8},width:m.n===0?3:m.n===1?2:1.2,smooth:{type:"cubicBezier",forceDirection:"horizontal",roundness:.55}};}

/* ===== 3) RED (Vis.js) sin física: el diseño lo calcula la sección 4 ===== */
const nodes=new vis.DataSet(), edges=new vis.DataSet();
nodes.add(Object.assign(def(ROOT),{x:0,y:0}));
tops.forEach(t=>{nodes.add(Object.assign(def(t),{x:0,y:0}));edges.add(arista(t));});
const network=new vis.Network(document.getElementById("network"),{nodes,edges},{physics:{enabled:false},interaction:{hover:true,tooltipDelay:100000}});
const refresca=id=>nodes.update({id,label:label(id)});
function mostrar(id){const p=network.getPositions([id])[id]||{x:0,y:0};meta[id].hijos.forEach(h=>{nodes.add(Object.assign(def(h),{x:p.x,y:p.y}));edges.add(arista(h));});}
function ocultar(id){meta[id].hijos.forEach(h=>{ocultar(h);meta[h].open=false;if(nodes.get(h)){nodes.remove(h);edges.remove("e_"+h);}});}
function alternar(id){const m=meta[id];m.open=!m.open;m.open?mostrar(id):ocultar(id);refresca(id);}
function abrir(id){const m=meta[id];if(m.n<2&&m.hijos.length){if(!m.open){m.open=true;mostrar(id);refresca(id);}m.hijos.forEach(abrir);}}
function abrirHasta(id){const p=meta[id].p;if(p&&p!==ROOT){abrirHasta(p);if(!meta[p].open){meta[p].open=true;mostrar(p);refresca(p);}}}

/* ===== 4) DISEÑO EQUILIBRADO: ejes a izquierda y derecha, ramas en columnas ===== */
const COL={1:330,2:600,3:870}, RAN={0:84,1:60,2:60}, GAP=30;
const alto=id=>{const m=meta[id];return m.open&&m.hijos.length?Math.max(RAN[m.n],m.hijos.reduce((s,h)=>s+alto(h),0)):RAN[m.n];};
function colocar(id,lado,y0,pos){const m=meta[id],x=lado*COL[m.n+1];
 if(m.open&&m.hijos.length){let y=y0;m.hijos.forEach(h=>{colocar(h,lado,y,pos);y+=alto(h);});pos[id]={x,y:(pos[m.hijos[0]].y+pos[m.hijos[m.hijos.length-1]].y)/2};}
 else pos[id]={x,y:y0+alto(id)/2};}
function calcular(){const pos={[ROOT]:{x:0,y:0}};
 [1,-1].forEach((lado,k)=>{const r=tops.filter((t,i)=>i%2===k);let y=-(r.reduce((s,t)=>s+alto(t),0)+GAP*Math.max(0,r.length-1))/2;
  r.forEach(t=>{colocar(t,lado,y,pos);y+=alto(t)+GAP;});});return pos;}
let anim=0;const quieto=matchMedia("(prefers-reduced-motion:reduce)").matches;
function layout(ajustar=true){const obj=calcular(),ids=Object.keys(obj).filter(i=>nodes.get(i)),ini=network.getPositions(ids),t0=performance.now(),dur=quieto?0:450,mio=++anim;
 (function paso(t){if(mio!==anim)return;const k=dur?Math.min(1,(t-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  ids.forEach(i=>{const a=ini[i]||obj[i],b=obj[i];network.moveNode(i,a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e);});
  if(k<1)requestAnimationFrame(paso);else if(ajustar)network.fit({animation:quieto?false:{duration:450,easingFunction:"easeInOutQuad"}});})(performance.now());}

/* ===== 5) PANEL LATERAL: resumen ejecutivo y detalle de cada nodo ===== */
const panel=document.getElementById("panel"), pop=document.getElementById("pop");
function resumen(){panel.innerHTML='<h2>Resumen ejecutivo</h2><p class="msg">'+MENSAJE+'</p>'+D.map(([t,c,gs])=>
 '<details class="eje" style="border-left-color:'+c+'"><summary>'+t+'</summary><div class="in">'+gs.map(([g,ls])=>'<h4>'+g+'</h4>'+ls.map(([a,b])=>'<p><b>'+a+'.</b> '+b+'</p>').join("")).join("")+'</div></details>').join("")+
 '<p class="hint">Haz clic en un eje o grupo del mapa para abrir su rama; pasa el cursor sobre un punto para leerlo.</p>';}
function ruta(id){const r=[];for(let m=meta[id];m&&m.n>=0;m=meta[m.p])r.unshift(m.t);return r.join(" › ");}
function detalle(id){const m=meta[id];
 panel.innerHTML='<button class="back" id="vuelve">← Resumen ejecutivo</button><div class="crumb">'+ruta(id)+'</div><h2>'+m.t+'</h2>'+
 (m.n===2?'<div class="block">'+m.tx+'</div>':'<div>'+m.hijos.map(h=>'<button class="chip" data-id="'+h+'">'+meta[h].t+'</button>').join("")+'</div>');
 document.getElementById("vuelve").onclick=resumen;
 panel.querySelectorAll(".chip").forEach(b=>b.onclick=()=>ir(b.dataset.id));}
function ir(id){const m=meta[id];abrirHasta(id);if(m.n<2&&!m.open)alternar(id);detalle(id);layout(false);setTimeout(()=>network.focus(id,{scale:.9,animation:quieto?false:true}),480);}

network.on("click",p=>{const id=p.nodes[0];if(!id)return;const m=meta[id];
 if(m.n===-1){resumen();return;}if(m.n<2){alternar(id);layout();}detalle(id);});
network.on("hoverNode",p=>{const m=meta[p.node];if(m.n!==2)return;const s=network.canvasToDOM(network.getPositions([p.node])[p.node]),w=document.getElementById("stage").clientWidth;
 pop.innerHTML="<b>"+m.t+"</b><span>"+m.tx+"</span>";pop.style.left=Math.max(10,Math.min(w-300,s.x+10))+"px";pop.style.top=(s.y+28)+"px";pop.classList.add("show");});
["blurNode","dragStart","zoom"].forEach(e=>network.on(e,()=>pop.classList.remove("show")));

/* ===== 6) CONTROLES ===== */
const $=id=>document.getElementById(id), cnt=$("count");
$("bExp").onclick=()=>{tops.forEach(abrir);layout();};
$("bCol").onclick=()=>{tops.forEach(t=>{ocultar(t);meta[t].open=false;refresca(t);});layout();};
$("bLay").onclick=()=>layout();
$("bFit").onclick=()=>network.fit({animation:quieto?false:true});
$("bRes").onclick=resumen;
$("q").oninput=e=>{const q=e.target.value.trim().toLowerCase();const hojas=Object.keys(meta).filter(i=>meta[i].n===2);
 if(!q){hojas.forEach(i=>nodes.get(i)&&nodes.update({id:i,opacity:1}));cnt.textContent="";return;}
 tops.forEach(abrir);const ok=hojas.filter(i=>(meta[i].t+" "+meta[i].tx).toLowerCase().includes(q));
 hojas.forEach(i=>nodes.update({id:i,opacity:ok.includes(i)?1:.18}));cnt.textContent=ok.length+" de "+hojas.length+" puntos";layout();};

resumen();layout(true);
</script>
</body>
</html>
